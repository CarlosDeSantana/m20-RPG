
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Matrix RPG | Mapa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .mapa {
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
    }

    .mapa-container {
      position: relative;
      padding-bottom: 127%;
      padding-top: 0;
      height: 0;
    }

    .mapa-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      max-width: 100%;
      overflow-y: auto;
    }
  </style>
</head>

<body>
  <main class="mapa">
    <div class="mapa-container">
      <iframe
        src="https://interactive-img.com/view?id=72268&iframe=true"
        width="100%"
        height="100%"
        title="Mapa Interativo - Matrix RPG"
        allowfullscreen>
      </iframe>
    </div>
  </main>
</body>
</html>
